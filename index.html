<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b7a75">
  <title>진료 예약</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="screen">
    <header class="appbar"><span class="appbar__title">진료 예약</span></header>

    <main class="screen__body screen__body--with-bar">
      <section class="stack">
        <h1>홍길동님, 안녕하세요</h1>
        <p class="muted">진료 예약부터 결제까지 한 곳에서 할 수 있어요.</p>
      </section>

      <section class="stack">
        <h2>다가오는 예약</h2>
        <div class="card stack">
          <div class="row"><h3>내과 · 김서연 전문의</h3><span class="badge badge--warn">결제 대기</span></div>
          <p class="muted num">10월 14일(화) 09:30</p>
          <button class="btn btn--secondary btn--block">결제하기</button>
        </div>
      </section>

      <section class="stack">
        <h2>메뉴</h2>
        <ul class="list">
          <li><a class="list__item list__item--link" href="#"><span class="list__main"><span class="list__title">내 예약 내역</span><span class="list__sub">예약 확인·변경·취소</span></span></a></li>
          <li><a class="list__item list__item--link" href="#"><span class="list__main"><span class="list__title">결제 내역</span><span class="list__sub">영수증 확인</span></span></a></li>
          <li><a class="list__item list__item--link" href="#"><span class="list__main"><span class="list__title">내 정보</span><span class="list__sub">연락처·보험 정보</span></span></a></li>
        </ul>
      </section>

      <p class="muted">화면의 이름과 예약 내용은 예시입니다.</p>
    </main>

    <div class="bottom-bar"><a class="btn btn--block" href="#">진료 예약하기</a></div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
